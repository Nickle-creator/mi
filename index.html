<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One question</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" as="image" href="supper-at-emmaus-hd.webp">
<link rel="stylesheet" href="fonts.css">
<script>document.documentElement.classList.add('js','prelude');</script>
<style>
  :root{ --paper:#000; --ink:#f3ecdf; --ink2:#b9b5ab; --rule:rgba(243,236,223,.3); --burn:#d29a52; --onburn:#000; --ease:cubic-bezier(.22,.8,.2,1);
    --serif:'Instrument Serif',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mx:50vw; --my:45vh; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:#000; color:var(--ink); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; touch-action:manipulation; }
  #bg{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; transform:scale(1.035); transition:transform 6s cubic-bezier(.2,.6,.2,1); will-change:transform; }
  html.open #bg{ transform:scale(1); }
  body.leaving #bg{ transform:scale(1.09); transition-duration:2.2s; }
  /* static dimming + a small warm lantern that follows the cursor (cheap: one small layer moved with transform) */
  .dim{ position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse 85% 85% at 50% 52%, rgba(0,0,0,.34), rgba(0,0,0,.84)); }
  .lamp{ position:fixed; left:0; top:0; width:760px; height:760px; margin:-380px 0 0 -380px; pointer-events:none; opacity:0; transition:opacity 1.2s var(--ease); will-change:transform;
    background:radial-gradient(circle, rgba(255,214,160,.17) 0, rgba(255,214,160,.07) 38%, rgba(255,214,160,0) 68%); }
  #lamp{ display:none !important; }
  html.revealed .lamp{ opacity:1; }
  .curtain{ position:fixed; inset:0; z-index:200; background:#000; pointer-events:none; opacity:1; transition:opacity 1.3s var(--ease); }
  html.open .curtain{ opacity:0; }
  body.leaving .curtain{ opacity:1; transition:opacity .8s var(--ease) .9s; }
  .top{ position:fixed; left:0; right:0; top:0; height:46svh; pointer-events:none; background:linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,.55) 55%,transparent); }
  main{ position:relative; z-index:5; text-align:center; padding:clamp(2.2rem,7svh,4rem) 1.2rem 0; }
  .ask{ display:grid; gap:1.1rem; justify-items:center; }
  .label{ font:500 .64rem/1 var(--sans); letter-spacing:.2em; text-transform:uppercase; color:var(--burn); }
  h1{ font:400 clamp(2.8rem,8vw,6.8rem)/.92 var(--serif); letter-spacing:-.04em; }
  .count{ font:500 .58rem/1 var(--sans); letter-spacing:.2em; text-transform:uppercase; color:var(--ink2); display:grid; gap:.55rem; justify-items:center; }
  .meter{ width:calc(var(--mw,100) * 1.2px); height:2px; background:rgba(243,236,223,.2); transition:width 1.1s var(--ease); }
  .meter i{ display:block; height:100%; width:0; background:var(--burn); transition:width .35s var(--ease); }
  .count.oops{ color:var(--burn); animation:oopsShake .6s ease 1; }
  .count.oops .meter i{ background:var(--ink); }
  @keyframes oopsShake{ 0%,100%{ transform:none; } 20%{ transform:translateX(-7px) rotate(-1deg); } 40%{ transform:translateX(7px) rotate(1deg); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); } }
  .ask>.label,.ask>h1,.ask>.count{ opacity:1; transform:none; transition:opacity .75s var(--ease),transform .75s var(--ease); }
  html.js.prelude .ask>.label,html.js.prelude .ask>h1,html.js.prelude .ask>.count{ opacity:0; transform:translateY(10px); }
  html.js.typing .ask>.label,html.js.typing .ask>h1,html.js.revealed .ask>.label,html.js.revealed .ask>h1,html.js.revealed .ask>.count{ opacity:1; transform:none; }
  html.js.revealed .ask>.count{ transition-delay:.32s; }
  #q.typing::after{ content:''; display:inline-block; width:1px; height:.78em; margin-left:.08em; background:var(--burn); vertical-align:-.08em; animation:caret .8s steps(1,end) infinite; }
  @keyframes caret{ 50%{ opacity:0; } }
  button{ font:400 clamp(1.25rem,1.8vw,1.55rem)/1 var(--serif); cursor:pointer; color:inherit; min-width:8.5rem; padding:1rem 2.4rem; transition:transform .3s var(--ease), background .3s, color .3s, box-shadow .3s, opacity .75s var(--ease); }
  #yes{ position:fixed; z-index:20; left:0; top:0; background:var(--burn); color:var(--onburn); border:1px solid var(--burn); box-shadow:5px 5px 0 var(--ink); will-change:transform; transition:transform .38s var(--ease),opacity .75s var(--ease); }
  #no{ position:fixed; z-index:15; left:0; top:0; translate:-50% -50%; background:rgba(0,0,0,.55); color:var(--ink); border:1px solid var(--ink); box-shadow:5px 5px 0 var(--burn); }
  #no:hover{ background:var(--ink); color:#000; } #no:active{ box-shadow:1px 1px 0 var(--burn); }
  #yes:focus-visible,#no:focus-visible{ outline:1px solid var(--ink); outline-offset:6px; }
  html.js.prelude #yes,html.js.prelude #no{ opacity:0; pointer-events:none; }
  html.js.revealed #yes,html.js.revealed #no{ opacity:1; pointer-events:auto; transition-delay:.18s; }
  #slot{ position:fixed; left:50%; bottom:7svh; width:9.5rem; height:3.6rem; translate:-50% 0; }
  /* the figures speak */
  .say{ position:fixed; z-index:18; left:0; top:0; width:max-content; max-width:min(15rem,calc(100vw - 2rem)); padding:.7rem .95rem; background:rgba(0,0,0,.88); border:1px solid rgba(243,236,223,.28); border-radius:6px; font:400 1.15rem/1.25 var(--serif); color:var(--ink); opacity:0; pointer-events:none; transform:scale(.72); transform-origin:var(--ox,50%) var(--oy,50%); transition:opacity .35s var(--ease),transform .5s cubic-bezier(.3,1.5,.5,1); }
  .say.on{ opacity:1; transform:scale(1); }
  /* the pointer grows out of the speaker's head: JS sets its side, position and length */
  .say::after{ content:''; position:absolute; background:rgba(0,0,0,.88); }
  .say[data-side=left]::after{ right:100%; top:var(--ty,50%); width:var(--tl,40px); height:20px; margin-top:-10px; clip-path:polygon(100% 0,0 50%,100% 100%); }
  .say[data-side=right]::after{ left:100%; top:var(--ty,50%); width:var(--tl,40px); height:20px; margin-top:-10px; clip-path:polygon(0 0,100% 50%,0 100%); }
  .say[data-side=top]::after{ bottom:100%; left:var(--tx,50%); height:var(--tl,40px); width:20px; margin-left:-10px; clip-path:polygon(0 100%,50% 0,100% 100%); }
  .say[data-side=bottom]::after{ top:100%; left:var(--tx,50%); height:var(--tl,40px); width:20px; margin-left:-10px; clip-path:polygon(0 0,50% 100%,100% 0); }
  .plate{ position:fixed; z-index:6; left:1.2rem; bottom:1rem; font:500 .56rem/1.5 var(--sans); letter-spacing:.18em; text-transform:uppercase; color:var(--ink2); transition:opacity .8s var(--ease); }
  html.js.prelude .plate{ opacity:0; }
  html.js.revealed .plate{ opacity:1; transition-delay:.08s; }
  .done{ display:none; position:relative; z-index:6; }
  body.won .ask,body.won #yes,body.won #no,body.won .say,body.won .lamp{ display:none; }
  body.won .done{ display:grid; gap:1.4rem; justify-items:center; padding-top:18svh; animation:in 1.4s var(--ease) both; }
  body.won .top{ height:100%; background:rgba(0,0,0,.78); }
  .done h2{ font:400 clamp(3.4rem,11vw,9.5rem)/.9 var(--serif); letter-spacing:-.045em; }
  .done p:not(.label){ font:400 clamp(1.1rem,2vw,1.5rem)/1.5 var(--serif); color:var(--ink2); }
  .done .done-note{ max-width:34ch; font:400 clamp(.95rem,1.35vw,1.15rem)/1.45 var(--serif); }
  .done a{ margin-top:1rem; font:500 .66rem/1 var(--sans); letter-spacing:.2em; text-transform:uppercase; color:var(--ink); text-decoration:none; border-bottom:1px solid var(--burn); padding-bottom:.4rem; }
  @keyframes in{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ #yes,#no,.say,#bg,.ask>*,.plate,#bg,.lamp,.curtain,.dim{ transition:none !important; } #q.typing::after{ animation:none; } .count.oops{ animation:none; } .meter,.meter i{ transition:none !important; } .done{ animation:none !important; } }
  /* touch devices (no cursor to light the scene): once the question has typed out, ease the painting back and brighten it */
  .dim{ transition:opacity 3.6s var(--ease) .2s; }
  @media (hover:none) and (pointer:coarse){
    #bg{ transform:scale(1.14); }
    html.open #bg{ transform:scale(1.14); }
    html.revealed #bg{ transform:scale(1); transition:transform 4.2s cubic-bezier(.2,.6,.2,1); }
    body.leaving #bg{ transform:scale(1.09); transition-duration:2.2s; }
    html.revealed .dim{ opacity:.5; }
    .lamp{ display:none; }
  }
  @media (max-width:520px){ button{ min-width:5.6rem; padding:.9rem 1.3rem; } #slot{ width:7.4rem; } .say{ font-size:1rem; max-width:11rem; } }
  .tear-stage{display:none;position:fixed;inset:0;z-index:250;overflow:hidden;background:#07080c;pointer-events:none}
  body.leaving .tear-stage{display:block}
  .tear-sky,.tear-half{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tear-sky{opacity:0;background:#07080c url('art/hero-starry.webp') center/cover no-repeat;transform:scale(1.02);animation:sky-open 1.9s .55s cubic-bezier(.3,.5,.4,1) forwards}
  .tear-half{will-change:transform}
  .tear-a{clip-path:polygon(0 0,100% 0,96% 7%,91% 12%,93% 17%,86% 23%,88% 29%,80% 35%,83% 41%,73% 47%,76% 52%,66% 58%,69% 64%,58% 70%,61% 75%,50% 81%,53% 86%,41% 92%,44% 96%,34% 100%,0 100%);animation:tear-a 2s .3s linear forwards}
  .tear-b{clip-path:polygon(100% 0,96% 7%,91% 12%,93% 17%,86% 23%,88% 29%,80% 35%,83% 41%,73% 47%,76% 52%,66% 58%,69% 64%,58% 70%,61% 75%,50% 81%,53% 86%,41% 92%,44% 96%,34% 100%,100% 100%);animation:tear-b 2s .3s linear forwards}
  .tear-rip,.tear-glow{position:absolute;inset:0;pointer-events:none}
  .tear-rip{background:#e8dcc6;clip-path:polygon(100% 0,96% 7%,91% 12%,93% 17%,86% 23%,88% 29%,80% 35%,83% 41%,73% 47%,76% 52%,66% 58%,69% 64%,58% 70%,61% 75%,50% 81%,53% 86%,41% 92%,44% 96%,34% 100%,31% 100%,41% 94%,38% 91%,48% 85%,46% 80%,56% 74%,54% 69%,65% 63%,62% 58%,72% 52%,70% 47%,79% 40%,77% 35%,85% 28%,83% 23%,90% 17%,88% 12%,94% 6%,97% 0);animation:rip-fade .7s 1.05s ease forwards}
  .tear-glow{background:#d29a52;clip-path:polygon(100% 0,98% 0,34% 100%,36% 100%);opacity:.8;animation:glow-fade .9s 1s ease forwards}
  @keyframes tear-a{0%{transform:none;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}38%{transform:translate(-6vw,-4vh) rotate(-2.5deg);opacity:1;animation-timing-function:cubic-bezier(.5,0,.85,.6)}85%{opacity:1}100%{transform:translate(-64vw,-48vh) rotate(-8deg);opacity:0}}
  @keyframes tear-b{0%{transform:none;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}38%{transform:translate(5vw,5vh) rotate(2deg);opacity:1;animation-timing-function:cubic-bezier(.5,0,.85,.6)}85%{opacity:1}100%{transform:translate(60vw,52vh) rotate(7deg);opacity:0}}
  @keyframes sky-open{from{opacity:0;transform:translateX(6%) scale(1.08)}to{opacity:1;transform:translateX(0) scale(1.08)}}
  @keyframes rip-fade{to{opacity:0}} @keyframes glow-fade{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){.tear-stage{display:none!important}}
</style>
</head>
<body>
<img id="bg" src="supper-at-emmaus-hd.webp" alt="" aria-hidden="true">
<div class="tear-stage" aria-hidden="true"><div class="tear-sky"></div><img class="tear-half tear-a" src="supper-at-emmaus-hd.webp" alt=""><img class="tear-half tear-b" src="supper-at-emmaus-hd.webp" alt=""><div class="tear-glow"></div><div class="tear-rip"></div></div>
<div class="dim" aria-hidden="true"></div><div class="lamp" id="lamp" aria-hidden="true"></div><div class="top" aria-hidden="true"></div>
<main>
  <section class="ask">
    <p class="label">Gotham City · Confidential</p>
    <h1 id="q" aria-label="Are you Batman?">Are you Batman?</h1>
    <p class="count" id="count"><span id="cnt">&nbsp;</span><span class="meter" id="meter"><i id="fill"></i></span></p>
  </section>
  <section class="done" aria-live="polite">
    <p class="label">The truth, at last</p>
    <h2>Only I can be Batman.</h2>
    <p>Now you may enter.</p>
    <p class="done-note">Your secret is safe with me. The portrait has already told three people. Jerry is waiting on the other side.</p>
    <a href="home.html">Come in</a>
  </section>
</main>
<div class="say from-left" id="s-christ" aria-hidden="true"></div><div class="say from-right" id="s-beard" aria-hidden="true"></div><div class="say from-left" id="s-green" aria-hidden="true"></div>
<p class="plate">Caravaggio, The Supper at Emmaus, 1601</p>
<span id="slot"></span>
<button id="no" type="button">No</button>
<button id="yes" type="button">Yes</button>
<div class="curtain" aria-hidden="true"></div>
<script>
/* Edit the wording here. Painting coordinates are in the 1100 x 782 image. */
var CFG = {
  attemptsToGiveUp: 100,
  lines: {
    christ: ["It is on the table. Press No.","Go on. Press No.","You know the answer.","Press No, my dear.","The bread is innocent.","We have been waiting since 1601.","One small click. No prophecy required.","I am trying to make eye contact.","Please stop interrogating the fruit.","That is a very dramatic pause."],
    beard:  ["Not that one!","Yes? Never!","The other button!","Stop chasing it!","That is one suspicious cape.","I have seen subtler detectives.","The table is not part of the case.","Careful with the tablecloth.","We were promised a quiet supper.","I would testify, but I have no idea."],
    green:  ["Do not chase it.","It only runs.","Just press No.","Be sensible.","The bread had nothing to do with it.","Even the painting knows.","The grapes are not taking questions.","Could we finish dinner first?","This is not what the candles are for.","A tap will do. No interrogation needed."]
  },
  giveUp: "Fine. Go on, then.",
  finalAttempts: 150,
  oops: "Oops. I meant 150.",
  oopsReply: "He moved the goalposts."
};
var IW=1100, IH=782;
var ANCHOR={ christ:[430,285], beard:[1085,420], green:[330,340], no:[925,655] };
var yes=document.getElementById('yes'), no=document.getElementById('no'), slot=document.getElementById('slot');
var dodges=0, caught=false, said=0, timers={}, introDone=false, leaving=false, tick=0, lx=0, ly=0, pressLockUntil=0;
function map(p){ var vw=innerWidth,vh=innerHeight,s=Math.max(vw/IW,vh/IH); return [(vw-IW*s)/2+p[0]*s,(vh-IH*s)/2+p[1]*s]; }
/* where each speaker's head sits in the 1100 x 782 painting, and which way their bubble leans */
var HEAD={ christ:{p:[619,254],side:'right',gap:78}, beard:{p:[835,323],side:'left',gap:64}, green:{p:[335,345],side:'left',gap:70} };
function bubble(k){
  var e=document.getElementById('s-'+k), c=HEAD[k], vw=innerWidth, vh=innerHeight, m=12;
  var sc=Math.max(vw/IW,vh/IH), r=Math.max(46,58*sc); /* r ~ radius of a painted face, so the box sits clear of it */
  var P=map(c.p); P[0]=Math.min(Math.max(P[0],26),vw-26); P[1]=Math.min(Math.max(P[1],26),vh-26);
  var w=e.offsetWidth||200, h=e.offsetHeight||56, placed=c.side, left, top, tl;
  if(placed==='right') left=P[0]+r+24; else left=P[0]-r-24-w;
  top=P[1]-h*.72;
  if(left<m||left+w>vw-m){ /* no room beside the head (phones): sit well below it (or above it if the head is low) */
    placed=(P[1]>vh*.5)?'above':'below';
    left=Math.min(Math.max(P[0]-w/2,m),vw-w-m);
    top=placed==='above'?P[1]-r-30-h:P[1]+r+30;
  }
  top=Math.min(Math.max(top,m),vh-h-m);
  var side=({right:'left',left:'right',above:'bottom',below:'top'})[placed]; /* the pointer sits on the edge facing the head */
  e.dataset.side=side; e.style.left=Math.round(left)+'px'; e.style.top=Math.round(top)+'px';
  var ty=Math.min(Math.max(P[1]-top,16),h-16), tx=Math.min(Math.max(P[0]-left,16),w-16);
  if(side==='left'||side==='right'){
    tl=side==='left'?left-(P[0]+r*.55):(P[0]-r*.55)-(left+w);
    e.style.setProperty('--ty',ty+'px'); e.style.setProperty('--ox',(side==='left'?0:w)+'px'); e.style.setProperty('--oy',ty+'px');
  } else {
    tl=side==='top'?top-(P[1]+r*.6):(P[1]-r*.6)-(top+h);
    e.style.setProperty('--tx',tx+'px'); e.style.setProperty('--ox',tx+'px'); e.style.setProperty('--oy',(side==='top'?0:h)+'px');
  }
  e.style.setProperty('--tl',Math.max(16,tl)+'px');
}
function layout(){
  var n=map(ANCHOR.no), nw=no.offsetWidth||130, nh=no.offsetHeight||56; n[0]=Math.min(Math.max(n[0],nw/2+14),innerWidth-nw/2-14); n[1]=Math.min(Math.max(n[1],innerHeight*.5),innerHeight-nh-innerHeight*.2); no.style.left=n[0]+'px'; no.style.top=n[1]+'px';
  ['christ','beard','green'].forEach(bubble);
}
function speak(k,t,ms){ var e=document.getElementById('s-'+k); document.querySelectorAll('.say.on').forEach(function(open){ if(open!==e) open.classList.remove('on'); }); e.textContent=t; layout(); e.classList.add('on'); clearTimeout(timers[k]); timers[k]=setTimeout(function(){ e.classList.remove('on'); },ms||3000); }
function chatter(){ var ks=['christ','beard','green'],k=ks[said%3],a=CFG.lines[k]; speak(k,a[Math.floor(said/3)%a.length]); said++; }
var shownLimit=CFG.attemptsToGiveUp, extended=false, countEl=document.getElementById('count'), cntEl=document.getElementById('cnt'), meterEl=document.getElementById('meter'), fillEl=document.getElementById('fill');
function ui(){
  cntEl.textContent=caught?'':'Attempts '+dodges+' / '+Math.round(shownLimit);
  meterEl.style.visibility=caught?'hidden':'visible';
  fillEl.style.width=Math.min(100,dodges/shownLimit*100)+'%';
}
/* at 100 attempts the limit quietly grows to 150 (with an apology of sorts) */
function growLimit(){
  var from=shownLimit, to=CFG.finalAttempts, t0=performance.now(), dur=1300;
  meterEl.style.setProperty('--mw',to);
  countEl.classList.remove('oops'); void countEl.offsetWidth; countEl.classList.add('oops');
  setTimeout(function(){ countEl.classList.remove('oops'); },2600);
  (function step(now){ var k=Math.min(1,(now-t0)/dur); shownLimit=from+(to-from)*(1-Math.pow(1-k,3)); ui(); if(k<1) requestAnimationFrame(step); else shownLimit=to; })(t0);
  speak('christ',CFG.oops,3200);
  setTimeout(function(){ if(!caught) speak('beard',CFG.oopsReply,3000); },3400);
}
function place(x,y){ yes.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)'; }
function home(){ var r=slot.getBoundingClientRect(), b=yes.getBoundingClientRect(); place(r.left+(r.width-b.width)/2, r.top+(r.height-b.height)/2); }
function away(px,py){
  var w=innerWidth,h=innerHeight,b=yes.getBoundingClientRect(),m=14,tries=0,x,y,nb=no.getBoundingClientRect();
  do{ x=m+Math.random()*(w-b.width-2*m); y=m+Math.random()*(h-b.height-2*m); tries++;
      var far=Math.hypot(x+b.width/2-px,y+b.height/2-py)>Math.max(180,Math.min(w,h)*.38);
      var hitNo=!(x>nb.right+10||x+b.width<nb.left-10||y>nb.bottom+10||y+b.height<nb.top-10);
  }while((!far||hitNo)&&tries<40);
  place(x,y);
}
/* count=true only for a real press; merely hovering makes Yes slip away but is never counted as an attempt */
function dodge(px,py,count){
  if(!introDone||caught) return;
  if(count){
    dodges++;
    if(!extended&&dodges>=CFG.attemptsToGiveUp){ extended=true; growLimit(); }
    else if(extended&&dodges>=CFG.finalAttempts){ caught=true; yes.style.transition='transform 1.2s cubic-bezier(.22,.8,.2,1)'; home(); ui(); speak('christ',CFG.giveUp,4000); return; }
  }
  away(px,py); ui();
}
function near(e){ if(!introDone||caught) return; var b=yes.getBoundingClientRect(), pad=14;
  if(e.clientX>b.left-pad&&e.clientX<b.right+pad&&e.clientY>b.top-pad&&e.clientY<b.bottom+pad) dodge(e.clientX,e.clientY,false); }
var lamp=document.getElementById('lamp');
function moveLamp(){ tick=0; lamp.style.transform='translate3d('+lx+'px,'+ly+'px,0)'; }
addEventListener('pointermove',function(e){ lx=e.clientX; ly=e.clientY; if(!tick) tick=requestAnimationFrame(moveLamp); if(e.pointerType!=='touch') near(e); },{passive:true});
/* the figures only speak when you actually try the Yes box */
addEventListener('pointerdown',function(e){
  if(!introDone||caught||leaving) return;
  var b=yes.getBoundingClientRect(), pad=48;
  if(e.clientX>b.left-pad&&e.clientX<b.right+pad&&e.clientY>b.top-pad&&e.clientY<b.bottom+pad){
    e.preventDefault();
    var now=performance.now();
    if(now<pressLockUntil) return;
    pressLockUntil=now+260;
    chatter();
    dodge(e.clientX,e.clientY,true);
  }
});
yes.addEventListener('click',function(e){ if(!introDone||leaving){ e.preventDefault(); return; } if(!caught&&e.detail>0){ e.preventDefault(); return; } document.body.classList.add('won'); });
function goHome(e){
  if(e) e.preventDefault();
  if(!introDone||leaving) return;
  leaving=true; yes.disabled=true; no.disabled=true;
  try{ sessionStorage.setItem('mimi-jellyfish-arrival','1'); }catch(err){ }
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  speak('christ','Finally. Mind the jellyfish.',2200);
